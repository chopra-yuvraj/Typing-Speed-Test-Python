name: 🐛 Bug Report
description: Report something that isn't working
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and how to reproduce it.
      placeholder: |
        1. Open the app
        2. Set mode to '60 seconds'
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: dropdown
    id: source
    attributes:
      label: How are you running the app?
      options:
        - Windows .exe (GitHub Release)
        - From source (python typing_speed_test.py / python -m typingtest)
        - pip install
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the title bar, e.g. v2.0.0
      placeholder: v2.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Debug output (optional)
      description: Run `python -m typingtest --debug` and paste any errors here.
      render: shell
